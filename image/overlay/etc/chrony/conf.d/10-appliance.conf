# This host is an NTP client and never a server.
#
# Alpine's default already sets `cmdport 0`, closing the command socket. `port 0` is the other half: it
# stops chronyd opening a listening socket on UDP 123 at all. Nothing should be asking this machine for
# the time, and an open UDP port on the host holding every production credential is worth closing even
# when the DigitalOcean firewall would drop the traffic anyway -- the firewall is a second control, not
# a reason to skip the first.
#
# Clock accuracy still matters here and is why chrony is installed: every credential OpenBao issues is a
# time-bounded lease, and its TLS handshakes fail on skew.
port 0
