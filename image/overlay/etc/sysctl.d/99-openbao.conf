# Kernel hardening for a host whose only job is holding secrets in memory.

# No core dumps, from anything, ever. A core file from this process contains the unsealed barrier key
# and every credential in flight; writing one to disk would undo the point of locking the memory in the
# first place. `|/bin/false` discards the dump rather than piping it anywhere.
kernel.core_pattern=|/bin/false
fs.suid_dumpable=0

# No ptrace at all, not even for root. Level 3 is one-way for the life of the boot and is the strongest
# of the four: it removes the most direct route to reading another process's memory. The cost is that a
# live debugger cannot attach to OpenBao on this node, which is the intended trade.
kernel.yama.ptrace_scope=3

# Kernel address and log exposure, both of which help an attacker who already has a foothold.
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.perf_event_paranoid=3
kernel.kexec_load_disabled=1
kernel.unprivileged_bpf_disabled=1
net.core.bpf_jit_harden=2

# Ordinary network hygiene for a node with a public interface it never serves on.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.all.accept_source_route=0
net.ipv4.tcp_syncookies=1

# Reverse path filtering, LOOSE rather than strict, and this is a deliberate departure from the usual
# hardening advice.
#
# D20: this node carries a route per Kubernetes worker node back to that node's slice of the pod CIDR,
# and pod traffic arrives with a source address that belongs to none of this node's own subnets. Strict
# RPF (=1) is exactly the setting that drops such packets, and it would do so silently -- producing the
# same symptom D20 spent two wrong fixes chasing: pods time out reaching OpenBao while the node itself
# is demonstrably fine. Loose mode still rejects source addresses with no route at all.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
