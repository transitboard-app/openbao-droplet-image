# sshd for an appliance with exactly one human user and two automated ones.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
AllowUsers root

# TCP forwarding is REQUIRED and must not be turned off in a later hardening pass.
#
# Both of stack's tunnels are `ssh -L` port forwards through this node: `openbao:tunnel` forwards 8200
# because the OpenBao API is closed to everything outside the VPC, and `db:tunnel` forwards the managed
# PostgreSQL port because the database admits only tagged Droplets. Disabling this does not degrade
# anything gracefully -- it removes the only path an operator has to either service.
AllowTcpForwarding yes
GatewayPorts no
PermitTunnel no

# Everything else a forwarding-only session does not need.
AllowAgentForwarding no
X11Forwarding no
PermitUserEnvironment no
PrintMotd yes

# Unix-socket forwarding, which is the other half of AllowTcpForwarding and is not needed by either
# tunnel -- both forward TCP ports. Left on, it lets an authenticated session reach any socket on the
# filesystem, including anything a future service might bind there.
AllowStreamLocalForwarding no

# The sftp subsystem, named explicitly rather than inherited.
#
# It is load-bearing: OpenSSH 9 and later run `scp` over the SFTP protocol, and copying TLS material in
# with scp is the documented first-boot step. It is written here because the image installs
# openssh-sftp-server as its own package rather than taking the `openssh` meta-package, so this line and
# that entry in image/packages have to agree -- and a missing subsystem fails as an obscure protocol
# error rather than as a missing file.
Subsystem sftp /usr/lib/ssh/sftp-server

MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20

# Unauthenticated connections held open at once: 4, then a rising refusal probability to 16.
# The default is 10:30:100, which on a node whose only client is one operator is three orders of
# magnitude more concurrency than is ever wanted and is exactly what a pre-auth resource attack uses.
MaxStartups 4:30:16

# VERBOSE logs the fingerprint of the key that authenticated, which is the difference between knowing
# somebody logged in as root and knowing WHICH key did. On a node where every human action is taken as
# root through a shared account, that fingerprint is the only attribution available.
LogLevel VERBOSE

# The tunnel tasks set ServerAliveInterval 30 / ServerAliveCountMax 6 and hold a forward open across
# operations that can idle for ten minutes or more (a cluster apply). The server side has to be at least
# as patient or it reaps the forward mid-apply, which surfaces as a provider connection error after the
# expensive part has already succeeded.
ClientAliveInterval 30
ClientAliveCountMax 20
