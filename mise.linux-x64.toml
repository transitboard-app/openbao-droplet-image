
# openbao-droplet-image
#
# Builds the DigitalOcean custom image the OpenBao Droplets boot: a single-purpose Alpine appliance
# running OpenBao directly on the host, with no container runtime.
#
# **This is the only configuration, and it loads only on linux-x64.** There is deliberately no plain
# mise.toml: assembly mounts an ext4 filesystem and chroots into it, so it needs a Linux kernel with ext4
# and root, and a half-working setup on another platform is worth less than no setup at all. On macOS
# this directory simply has no tasks.
#
# `.miserc.toml` sets `auto_env = true`, which is what selects this file by platform without MISE_ENV
# being set by hand.
#
# The host does NOT need to be Alpine. alpine-make-vm-image installs host packages only when it detects
# /etc/alpine-release, and everywhere else downloads checksum-verified static apk-tools 2.14.10 and uses
# that -- which is why ubuntu-24.04 is a fine place to build, and why the apk-tools 3 incompatibility
# that breaks an Alpine host does not arise here.

[tools]
# OpenBao itself. The appliance's entire payload is this binary, and mise fetching it replaces what used
# to be a Docker pull, a container export, a tar extraction and a hand-maintained sha256 pin.
#
# Because this file only loads on linux-x64, this resolves to the binary the image needs or to nothing.
#
# Same source and version as stack's own mise.toml, deliberately. What it is NOT is the same artifact as
# stack's `openbao_image`, which pins the distroless CONTAINER by digest; this is the release binary from
# the same tag. They should be identical bytes and that has not been proved -- `mise run compare-upstream`
# does it on demand. Once the appliance replaces the container, `openbao_image` in
# stack/infrastructure/platform/variables.tf is vestigial and should go.
"github:openbao/openbao" = "2.6.1"
shellcheck = "latest"

# alpine-make-vm-image, which is a single POSIX shell script rather than a release artifact -- no tarball,
# no per-platform builds, just a file in a git tag. The http backend handles exactly that: it fetches the
# URL, checks it against the checksum below, and puts it on PATH.
#
# `checksum` is the whole supply-chain control for a script that runs as root with block-device access,
# and mise refuses to install on a mismatch. `size` is a second, cheaper tripwire on the same bytes.
#
# This replaced a hand-written task that curled the file, ran sha256sum -c, and chmod +x'd it, with
# `sources`/`outputs` to avoid refetching. mise does all of that.
[tools."http:alpine-make-vm-image"]
version = "0.13.4"
url = "https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/v{{version}}/alpine-make-vm-image"
checksum = "sha256:c643b7f894e34575836c4835bd2ded6f27958ea5212c1295b4f82ccd0b670029"
size = 26912
bin = "alpine-make-vm-image"

[vars]
# Alpine's release branch. A branch rather than `latest-stable`, which moves under you and would make two
# builds a month apart different machines -- the problem this image exists to remove from stack's
# cloud-init. It does not pin package versions within the branch, so a rebuild picks up security updates;
# /etc/openbao-appliance-packages inside the image records what a given build actually got.
alpine_branch = "v3.24"
alpine_mirror = "https://dl-cdn.alpinelinux.org/alpine"

# The VIRTUAL disk size, which is not the artifact size and does not affect it. qcow2 is sparse: the
# image measures 286 MiB used of 989 MiB (32% full) and the file on disk is 336 MiB, because the empty
# 700 MiB is described rather than stored. Raising or lowering this does not change what gets uploaded.
#
# What it does control is build headroom -- apk needs working space above the 286 MiB of content -- and
# a ceiling it must stay under, since the image cannot be larger than the disk it is restored onto and
# DigitalOcean's smallest Droplet has 25 GiB. 1 GiB is comfortable at both ends.
#
# It has no effect on a running node at all: tiny-cloud grows the root filesystem to fill the Droplet's
# disk on first boot, measured -- this image on a 5 GiB disk ends with a 5118 MiB root filesystem.
# The checksum mise verified the OpenBao download against, repeated here only so the provenance file
# inside the image can name what the stripped binary came from.
bao_sha256 = "736b8ecf354fda6b2af62e4ae064f12fe6c52d7db8425b9c6de22f286a5485ec"

image_size = "1G"
image_name = "openbao-appliance"

# Working directories, declared here rather than per task because the build: and boot: subtasks below
# each own one step of a sequence and have to agree on where the previous step left its output.
skel_dir = "{{ config_root }}/.build/skel"
stage_dir = "{{ config_root }}/.build/stage"
boot_work = "{{ config_root }}/.build/boot"

[env]
OUT_DIR = "{{ config_root }}/out"
BUILD_DIR = "{{ config_root }}/.build"
IMAGE = "{{ config_root }}/out/{{ vars.image_name }}.qcow2"

# The system packages alpine-make-vm-image needs. These are OS packages rather than registry tools, so no
# [tools] entry can supply them; `mise bootstrap packages apply` installs them, and mise never installs
# system packages implicitly.
#
# Both managers are declared and mise acts only on the one present, so this covers a Debian CI runner and
# an Alpine builder with no conditional. Values are plain strings: mise's docs show a table form carrying
# an `os` selector, but mise 2026.8.3 rejects it with `invalid type: map, expected a string`. It is moot
# here anyway, since this whole file only loads on linux-x64.
#
# Package names differ between the two: apt's qemu-utils carries qemu-img and qemu-nbd, and its sfdisk
# lives in fdisk.
[bootstrap.packages]
# wget, needed because alpine-make-vm-image fetches static apk-tools with it on any non-Alpine host, and
# Ubuntu's minimal images ship curl but not wget. Without it the build stops at
# `wget: not found` before writing anything.
# binutils for `strip`, which runs on the host so the image never carries it.
# bzip2 for the compress task, and binutils for `strip`, which runs on the host so the image never
# carries it. bzip2 happened to be present on the GitHub runner, which hid its absence until the build
# ran on a minimal Ubuntu.
"apt:bzip2" = "latest"
"apt:binutils" = "latest"
"apt:wget" = "latest"
"apt:qemu-utils" = "latest"
"apt:qemu-system-x86" = "latest"
"apt:rsync" = "latest"
"apt:fdisk" = "latest"
"apt:e2fsprogs" = "latest"
"apt:util-linux" = "latest"
"apk:bzip2" = "latest"
"apk:binutils" = "latest"
"apk:wget" = "latest"
"apk:qemu-img" = "latest"
"apk:qemu-system-x86_64" = "latest"
"apk:rsync" = "latest"
"apk:sfdisk" = "latest"
"apk:e2fsprogs" = "latest"
"apk:util-linux" = "latest"

# What [bootstrap.packages] cannot supply: a kernel feature. ext4 here is not a package but whether the
# running kernel can mount one, and the error it produces three layers down names neither ext4 nor the
# kernel. DigitalOcean requires ext3 or ext4, so btrfs is not a substitute where it is offered instead.
#
# There is no `set -eu` anywhere below. mise already aborts a task on the first failing command, in both
# inline scripts and `run` arrays -- measured, not assumed.
[tasks.deps]
description = "Check the host can do what the build needs"
vars = { required = "qemu-img qemu-nbd rsync sfdisk mkfs.ext4 losetup wget" }
run = """
missing=""
for tool in {{ vars.required }}; do
	command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
done
if [ -n "$missing" ]; then
	echo "missing:$missing" >&2
	echo "  mise bootstrap packages apply" >&2
	exit 1
fi

if ! grep -qw ext4 /proc/filesystems 2>/dev/null; then
	echo "this kernel has no ext4 support ($(uname -sr))" >&2
	echo "filesystems: $(awk '{print $NF}' /proc/filesystems 2>/dev/null | tr '\\n' ' ')" >&2
	echo >&2
	echo "On OrbStack the module exists but is not loaded, and a container cannot load it:" >&2
	echo "  sudo modprobe ext4      # from inside any OrbStack Linux machine" >&2
	echo "It does not survive an OrbStack restart. ubuntu-24.04 in CI needs nothing extra." >&2
	exit 1
fi
echo "system dependencies and ext4: ok"
"""

# The overlay, rsynced into / of the image by --fs-skel-dir. Configuration only: no binary goes through
# here, so it stays cheap to re-run.
[tasks."stage:overlay"]
description = "Stage the files copied verbatim into the image"
run = [
	"rm -rf {{ vars.skel_dir }}",
	"mkdir -p {{ vars.skel_dir }}",
	"cp -a {{ config_root }}/image/overlay/. {{ vars.skel_dir }}/",
]

# setup.sh and the 186 MiB binary, bind-mounted at /mnt inside the chroot by --script-chroot. The binary
# is installed by setup.sh rather than rsynced, so it is copied once instead of staged and copied again.
[tasks."stage:payload"]
description = "Stage the chroot script and the OpenBao binary"
run = [
	"rm -rf {{ vars.stage_dir }}",
	"mkdir -p {{ vars.stage_dir }}",
	"install -m 0755 {{ config_root }}/image/setup.sh {{ vars.stage_dir }}/setup.sh",
	# mise put this on PATH from [tools]; here it is exactly the binary the image needs.
	"""install -m 0755 "$(command -v bao)" {{ vars.stage_dir }}/bao""",
	# Asserted, not assumed: a staged binary of the wrong architecture would not surface until a Droplet
	# booted and OpenBao never started. Read out of the ELF header rather than through `file`, which is
	# not installed on a minimal Ubuntu and is not worth a package. Bytes 18-19 are e_machine,
	# little-endian; 0x003e is x86-64.
	"""test "$(od -An -tx1 -j18 -N2 {{ vars.stage_dir }}/bao | tr -d ' ')" = "3e00" || { echo 'staged bao is not an x86-64 ELF' >&2; exit 1; }""",
	# Stripped here, on the build host, not in the chroot -- doing it in the image would mean installing
	# binutils into the appliance to run `strip` once. Removes the ELF symbol table and DWARF: 186 MiB
	# to 136 MiB, 17% of the whole image. Go keeps its own pclntab, so panics still name functions, and
	# the stripped binary was run and reports its version correctly.
	#
	# Debug symbols on a host holding unsealed key material are worth more to somebody reverse
	# engineering it than to us.
	"strip --strip-all {{ vars.stage_dir }}/bao",
	# The one place the image is not byte-identical to what upstream published, so the link is recorded
	# rather than lost. mise verified the download against a pinned checksum before any of this ran.
	"""printf 'upstream %s\\nstripped %s\\n' "{{ vars.bao_sha256 }}" "$(sha256sum {{ vars.stage_dir }}/bao | cut -d' ' -f1)" > {{ vars.stage_dir }}/provenance""",
	"""{{ vars.stage_dir }}/bao version >/dev/null || { echo 'bao does not run after stripping' >&2; exit 1; }""",
	"""echo "staged bao: $(bao version | head -1)" """,
]

[tasks.stage]
description = "Assemble everything the build feeds into the chroot"
depends = ["deps"]
sources = ["image/**/*"]
outputs = ["{{ vars.stage_dir }}/setup.sh"]
run = [{ task = "stage:overlay" }, { task = "stage:payload" }]

# --partition is REQUIRED, not a preference: alpine-make-vm-image otherwise writes the filesystem
#   straight onto the disk with no partition table, which boots fine under QEMU and is rejected at
#   import, because DigitalOcean custom images must carry an MBR or GPT table.
# --initfs-features drops the default "kms" and keeps "scsi virtio". Both of the latter are mandatory:
#   CONFIG_VIRTIO_BLK and CONFIG_SCSI_VIRTIO are modules in linux-virt rather than builtins, so an
#   initramfs without them cannot mount the root filesystem -- and CONFIG_SCSI_VIRTIO is what produces
#   the /dev/disk/by-id/scsi-0DO_Volume_* path the Raft volume is mounted from.
# --serial-console because DigitalOcean's recovery console and QEMU both attach to ttyS0. Without it a
#   failed boot is a black rectangle with no way to read the panic.
[tasks."build:image"]
description = "Run alpine-make-vm-image (needs root)"
run = [
	"mkdir -p {{ env.OUT_DIR }}",
	"rm -f {{ env.IMAGE }}",
	# `command -v` first, because sudo resets PATH and would not otherwise find a mise-managed tool.
	"""sudo "$(command -v alpine-make-vm-image)" \
		--image-format qcow2 \
		--image-size "{{ vars.image_size }}" \
		--arch x86_64 \
		--branch "{{ vars.alpine_branch }}" \
		--mirror-uri "{{ vars.alpine_mirror }}" \
		--boot-mode BIOS \
		--partition \
		--rootfs ext4 \
		--kernel-flavor virt \
		--initfs-features "scsi virtio" \
		--serial-console \
		--packages "$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' {{ config_root }}/image/packages | tr '\\n' ' ')" \
		--fs-skel-dir {{ vars.skel_dir }} \
		--script-chroot \
		"$IMAGE" \
		{{ vars.stage_dir }}/setup.sh""",
]

# alpine-make-vm-image can fail without failing: its dependency install reports an apk error and still
# returns zero. The first build of this repository exited 0, printed "built", and had written no file at
# all. So the artifact is asserted, never the exit code -- which is why this is a step of its own rather
# than three lines at the end of the one above.
[tasks."build:assert"]
description = "Assert the build produced a real image"
# 200 MiB. A qcow2 holding only a partition table would satisfy a bare existence check, and the bao
# binary alone is 186 MiB, so the floor sits between the two.
vars = { minimum_bytes = "209715200" }
run = [
	"""test -s "$IMAGE" || { echo "FATAL: build reported success and produced no image" >&2; exit 1; }""",
	"""test "$(stat -c %s "$IMAGE")" -ge {{ vars.minimum_bytes }} || { echo "FATAL: $IMAGE is too small to contain OpenBao" >&2; exit 1; }""",
	"""sudo chown "$(id -u):$(id -g)" "$IMAGE" """,
	"""qemu-img info "$IMAGE" """,
]

# qcow2 never releases a cluster once written, so the image is still the size of its high-water mark
# even after setup.sh removes 80 MiB from it. A convert rewrites only the clusters that hold data, and
# setup.sh zeroed the free space precisely so the freed ones qualify.
[tasks."build:compact"]
description = "Rewrite the image without the clusters its build freed"
run = [
	"""before=$(stat -c %s "$IMAGE"); qemu-img convert -O qcow2 "$IMAGE" "$IMAGE.compact" && mv "$IMAGE.compact" "$IMAGE" && echo "compacted $((before / 1048576)) MiB -> $(( $(stat -c %s "$IMAGE") / 1048576 )) MiB"""",
]

[tasks.build]
description = "Build the appliance image (needs root)"
depends = ["stage"]
run = [{ task = "build:image" }, { task = "build:compact" }, { task = "build:assert" }]

# Builds a diagnostic image with password authentication enabled, for when a Droplet boots unreachable
# and there is no other way to read it. Deliberately not part of `build`, deliberately given its own
# output name, and it cannot pass `verify` -- which asserts the opposite of everything it does.
[tasks.debug]
description = "Build a DEBUG image with password auth (never release this)"
depends = ["stage"]
usage = """
flag "--password <password>" help="Root password to bake in" default="debug-only-throwaway"
"""
run = [
	"""echo "{{ usage.password }}" > {{ vars.stage_dir }}/debug-password""",
	{ task = "build:image" },
	{ task = "build:compact" },
	{ task = "build:assert" },
	"""mv "$IMAGE" "$OUT_DIR/openbao-appliance-DEBUG.qcow2" """,
	"""rm -f {{ vars.stage_dir }}/debug-password""",
	"""bzip2 --keep --force --best "$OUT_DIR/openbao-appliance-DEBUG.qcow2" """,
	"""ls -lh "$OUT_DIR/openbao-appliance-DEBUG.qcow2.bz2" """,
]

[tasks.verify]
description = "Assert the built image's contents without booting it"
run = "sudo {{ config_root }}/scripts/verify-image {{ env.IMAGE }}"

# A scratch copy, so a boot test cannot dirty the artifact that is about to be uploaded. Optionally
# grown first, which is how root-filesystem expansion gets exercised without a real Droplet.
[tasks."boot:prepare"]
description = "Copy the image to a scratch disk, optionally resized"
usage = """
flag "--disk-size <size>" help="Resize the scratch copy to this size" default=""
"""
run = [
	"rm -rf {{ vars.boot_work }}",
	"mkdir -p {{ vars.boot_work }}",
	"""cp "$IMAGE" {{ vars.boot_work }}/disk.qcow2""",
	"""test -z "{{ usage.disk_size }}" || qemu-img resize {{ vars.boot_work }}/disk.qcow2 {{ usage.disk_size }}""",
]

# DigitalOcean boots Droplets in legacy BIOS mode, which is what this matches.
#
# The VM is watched and killed as soon as it finishes booting, rather than left to run until a timeout.
# That distinction is the whole cost of this task: the appliance sits at a login prompt forever and never
# shuts down, so an earlier version waited the full `--seconds` on every run regardless of how quickly it
# came up -- four minutes to observe a boot that takes well under one.
#
# `--seconds` is now a deadline for the failure case, not the running time of the success case.
[tasks."boot:run"]
description = "Boot the scratch disk under QEMU and capture the serial console"
usage = """
flag "--seconds <seconds>" help="Give up after this long if the boot never completes" default="240"
"""
run = """
log={{ vars.boot_work }}/boot.log
: > "$log"

qemu-system-x86_64 \
	-machine q35 -m 1024 -smp 2 \
	-drive file={{ vars.boot_work }}/disk.qcow2,format=qcow2,if=virtio \
	-netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
	-nographic -display none -serial file:"$log" >/dev/null 2>&1 &
qemu=$!

# tiny-cloud's last step, or the getty prompt if it never got that far. Either means the boot is over
# and there is nothing more to learn by waiting; boot:assert decides whether it went well.
elapsed=0
while [ "$elapsed" -lt "{{ usage.seconds }}" ]; do
	grep -qE "bootstrap_complete|login:" "$log" 2>/dev/null && break
	kill -0 "$qemu" 2>/dev/null || break
	sleep 1
	elapsed=$((elapsed + 1))
done

kill "$qemu" 2>/dev/null || true
wait "$qemu" 2>/dev/null || true
echo "boot finished after ${elapsed}s"
"""

# What no amount of reading the recipe can answer: whether extlinux's BIOS boot works, whether the
# initramfs carries virtio, and whether AppArmor came up in the LSM stack rather than merely compiled in.
#
# Printing a filtered log proves nothing on its own -- an image that panics in the initramfs produces no
# matching lines at all, so "no matches" and "booted fine" look identical. The two greps below are what
# make this a test.
[tasks."boot:assert"]
description = "Assert the captured boot log shows a working system"
run = [
	"""grep -iE "AppArmor|expand_root|TLS material|Starting|\\[ !! \\]" {{ vars.boot_work }}/boot.log | head -30 || true""",
	"""grep -q "Loading AppArmor profiles" {{ vars.boot_work }}/boot.log || { echo "FATAL: AppArmor profiles never loaded; the boot did not reach OpenRC" >&2; exit 1; }""",
	"""grep -q "No TLS material" {{ vars.boot_work }}/boot.log || { echo "FATAL: the openbao service never ran its TLS gate" >&2; exit 1; }""",
	# The regression check for the bug that shipped three times. Nothing provided `net`, so every service
	# declaring `need net` -- tiny-cloud-main and cloud-ssh-keys both -- silently never ran, and the node
	# booted, answered on port 22 and installed no keys. This asserts the service RAN; it cannot assert
	# success, because QEMU has no metadata service for it to succeed against.
	"""grep -q "Fetching SSH keys" {{ vars.boot_work }}/boot.log || { echo "FATAL: cloud-ssh-keys never ran; nothing provided net" >&2; exit 1; }""",
	# udhcpc, not the service name: OpenRC logs "Starting networking ... eth0", and the string "net.eth0"
	# appears in the log only when an interface FAILS. Asserting on it made a passing boot look broken.
	"""grep -q "udhcpc: started" {{ vars.boot_work }}/boot.log || { echo "FATAL: no interface ran DHCP" >&2; exit 1; }""",
	"""echo "boot reached OpenRC, loaded AppArmor, and gated on TLS as intended" """,
]

# Arguments come from usage's template values, not the Tera arg and flag functions, which mise deprecates
# for removal in 2027.5.0 -- and which rendered an unset flag as something non-empty, so the first CI run
# called `qemu-img resize` with it and died on `Parameter 'size' expects a non-negative number below
# 2^64`. Passing them on unquoted is deliberate: quoting leaks the quote characters into the subtask.
#
# Do not name those two functions with their braces even inside a comment. mise renders the whole run
# script as a template, comments included, and a mention of one fails the task with `missing required
# 'name' parameter`.
[tasks.boot]
description = "Boot the image under QEMU and assert it came up"
usage = """
flag "--disk-size <size>" help="Resize a scratch copy first, to exercise root expansion" default=""
flag "--seconds <seconds>" help="How long to run before terminating" default="240"
"""
run = [
	{ task = "boot:prepare --disk-size {{ usage.disk_size }}" },
	{ task = "boot:run --seconds {{ usage.seconds }}" },
	{ task = "boot:assert" },
]

[tasks.compress]
description = "Compress the image for upload (bzip2, which DigitalOcean accepts)"
sources = ["{{ config_root }}/out/{{ vars.image_name }}.qcow2"]
outputs = ["{{ config_root }}/out/{{ vars.image_name }}.qcow2.bz2"]
run = [
	"bzip2 --keep --force --best {{ env.IMAGE }}",
	"ls -lh {{ env.IMAGE }}.bz2",
]

# `doctl compute image create` takes ONLY --image-url. There is no file upload in the API, so the
# artifact has to sit somewhere DigitalOcean's fetcher can reach with an unauthenticated GET first.
# Publishing it as an OCI artifact does not work and was the original plan: registry blobs need a token
# handshake even when public, and DigitalOcean's importer does not perform one.
[tasks.import]
description = "Register a published image URL as a DigitalOcean custom image"
usage = """
arg "<url>" help="Publicly fetchable URL of the compressed image"
flag "--name <name>" help="Custom image name" default="openbao-appliance"
flag "--region <region>" help="DigitalOcean region" default="lon1"
"""
run = [
	"""test -n "${DIGITALOCEAN_TOKEN:-}" || { echo "set DIGITALOCEAN_TOKEN" >&2; exit 1; }""",
	"""doctl compute image create "{{ usage.name }}" --image-url "{{ usage.url }}" --region "{{ usage.region }}" --image-distribution Alpine --tag-names transitboard,transitboard-openbao""",
	"""echo 'Custom images bill at $0.06/GiB/month and nothing prunes old ones: doctl compute image list-user' """,
]

# Proves the [tools] binary and the container image stack pins are the same bytes. Not part of the build:
# it needs Docker, and it answers a question that only matters while both exist.
[tasks."compare-upstream"]
description = "Compare mise's bao against the binary in stack's pinned distroless image"
vars = { distroless = "docker.io/openbao/openbao-distroless@sha256:03a477a399bc406d61c67b50d8864dd3cbd72ed9ff328e9f0a53c21daa28c6c2" }
run = """
container="$(docker create --platform linux/amd64 {{ vars.distroless }})"
trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
docker export "$container" | tar -xO usr/bin/bao > /tmp/bao-from-image
echo "  container: $(sha256sum /tmp/bao-from-image | cut -d' ' -f1)"
echo "  mise:      $(sha256sum "$(command -v bao)" | cut -d' ' -f1)"
"""

[tasks.lint]
description = "Shellcheck the runtime scripts the image ships"
run = "shellcheck --shell=sh --severity=warning scripts/verify-image image/setup.sh image/overlay/etc/init.d/* image/overlay/usr/local/sbin/openbao-selfcheck"

[tasks.clean]
description = "Remove build outputs and staging"
run = "rm -rf {{ config_root }}/out {{ config_root }}/.build"
